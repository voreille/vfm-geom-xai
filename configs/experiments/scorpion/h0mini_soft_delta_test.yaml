experiment:
  name: scorpion_h0mini_group_to_mean_paired_delta_projection
  type: paired_delta_projection

paths:
  tile_dir: data/processed/SCORPION_tiles_224px_0p5mpp
  metadata_csv: data/processed/SCORPION_tiles_224px_0p5mpp/metadata.csv
  embeddings_cache: outputs/embeddings/SCORPION_tiles_224px_0p5mpp/h0mini_cls.npz
  output_root: outputs/experiments/SCORPION_tiles_224px_0p5mpp

eraser:
  method: soft_delta_projection
  ranks: [null, 64]
  # ranks: [null, 1, 2, 4, 8, 16, 32, 64]
  lambdas: [100, 1000, 10000]
  affine: true
  shrink_A: true
  shrink_B: false
  ridge: 1.0e-4

model:
  encoder_id: h0-mini
  device: cuda
  token_mode: cls
  embedding_batch_size: 64
  num_workers: 4
  use_amp: true

data:
  scanner_col: scanner_id
  group_col: slide_id
  pair_col: null

projection:
  delta_mode: group_to_mean
  sign_mode: one
  ranks: [1, 2, 4, 8, 16, 32, 64]
  pca_center: true
  pca_svd_solver: randomized
  max_deltas_per_fold: null

cv:
  n_splits: 5
  seed: 0