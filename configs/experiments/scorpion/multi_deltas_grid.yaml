experiment:
  name: scorpion_scanner_stain_delta_grid
  type: multi_delta_grid

paths:
  tile_dir: data/processed/SCORPION_tiles_224px_0p5mpp
  metadata_csv: data/processed/SCORPION_tiles_224px_0p5mpp/metadata.csv
  embeddings_cache_root: outputs/embeddings/SCORPION_tiles_224px_0p5mpp
  stain_embeddings_cache_root: outputs/embeddings/SCORPION_stain_simulations
  output_root: outputs/experiments/SCORPION_tiles_224px_0p5mpp_multi_delta_debug

model:
  encoder_id: h-optimus-1
  device: cuda
  token_mode: cls
  embedding_batch_size: 64
  num_workers: 8
  use_amp: true

data:
  scanner_col: scanner_id

scanner_deltas:
  configurations:
    - name: scanner_slide_to_mean
      delta_mode: group_to_mean
      group_col: slide_id
      pair_col: null
      sign_mode: one
      max_deltas_per_fold: null
      max_test_deltas: null

    - name: scanner_image_to_mean
      delta_mode: group_to_mean
      group_col: image_id
      pair_col: null
      sign_mode: one
      max_deltas_per_fold: null
      max_test_deltas: null

stain_deltas:
  selected_scanners:
    - AT2
  matrices_root: /home/valentin/workspaces/vfm-geom-xai/outputs/stain_matrices/SCORPION_tiles_224px_0p5mpp/macenko

  # Explicit global stain exemplar panel.
  # Replace these with the slide IDs selected by your exploration script.
  target_slide_ids:
    - slide_1
    - slide_12
    - slide_18
    - slide_26
    - slide_33
    - slide_34
    - slide_41
    - slide_43
    - slide_44
    - slide_47

  # Optional override. If omitted, the builder/cache code uses:
  # paths.stain_embeddings_cache_root / {encoder_id}_{token_mode} /
  #   {method}_{restain_mode}_k{K}_{target_hash} / embeddings.h5
  # transformed_embeddings_cache_root: outputs/embeddings/SCORPION_stain_simulations

  source_sampling:
    strategy: per_image
    max_tiles_per_image: 4
    seed: 0

  compute_if_missing: true
  method: macenko
  restain_mode: basis_only
  source_slide_col: slide_id
  filename_col: filename
  image_ext: .jpg

  configurations:
    - name: stain_original_to_target
      delta_mode: original_to_target
      max_source_tiles_per_fold: null
      max_deltas_per_fold: 100000
      max_test_deltas: 100000
      seed: 0

    - name: stain_target_to_mean
      delta_mode: target_to_mean
      max_source_tiles_per_fold: null
      max_deltas_per_fold: 100000
      max_test_deltas: 100000
      seed: 0

delta_recipes:
  # - name: scanner_only
  #   components:
  #     - source: scanner.scanner_slide_to_mean
  #       weight: 1.0

  # - name: stain_only
  #   components:
  #     - source: stain.stain_target_to_mean
  #       weight: 1.0

  - name: scanner_plus_stain
    moment_normalization: trace
    normalize_source_weights: true
    components:
      - source: scanner.scanner_slide_to_mean
        weight: 0.5
      - source: stain.stain_target_to_mean
        weight: 0.5

erasers:
  # - method: paired_delta_pca
  #   ranks: [16, 32, 64, 128]
  #   whitening: true
  #   delta_moment: second_moment
  #   affine: true
  #   shrink_A: true
  #   shrink_B: false
  #   ridge: 1.0e-4
  #   svd_tol: 1.0e-7

  - method: soft_delta_projection
    ranks: [null, 64]
    lambdas: [100, 1000, 3000, 10000]
    delta_moment: [second_moment]
    affine: true
    shrink_A: true
    shrink_B: false
    ridge: 1.0e-4
    svd_tol: 1.0e-7

cv:
  group_col: slide_id
  n_splits: 5
  seed: 0
  probe_type: sgd

runtime:
  fit_dtype: float32
  apply_batch_size: 8192