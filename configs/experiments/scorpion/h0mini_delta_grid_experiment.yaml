experiment:
  name: scorpion_paired_delta_grid_test
  type: paired_delta_grid

paths:
  tile_dir: data/processed/SCORPION_tiles_224px_0p5mpp
  metadata_csv: data/processed/SCORPION_tiles_224px_0p5mpp/metadata.csv
  embeddings_cache_root: outputs/embeddings/SCORPION_tiles_224px_0p5mpp
  output_root: outputs/experiments/SCORPION_tiles_224px_0p5mpp_grid

model:
  encoder_id: h-optimus-1
  device: cuda
  token_mode: cls
  embedding_batch_size: 64
  num_workers: 4
  use_amp: true

data:
  scanner_col: scanner_id

deltas:
  configurations:
    - name: slide_to_mean
      delta_mode: group_to_mean
      group_col: slide_id
      pair_col: null
      sign_mode: one
      max_deltas_per_fold: null

    - name: image_to_mean
      delta_mode: group_to_mean
      group_col: image_id
      pair_col: null
      sign_mode: one
      max_deltas_per_fold: null

    - name: slide_mean_pairwise
      delta_mode: group_pairwise
      group_col: slide_id
      pair_col: tile_id
      sign_mode: one
      max_deltas_per_fold: null

erasers:
  - method: paired_delta_pca
    ranks: [1, 8, 16, 32, 64, 128]
    whitening: true
    delta_moment: second_moment
    affine: true
    shrink_A: true
    shrink_B: false
    ridge: 1.0e-4
    svd_tol: 1.0e-7

  - method: soft_delta_projection
    ranks: [null, 64]
    lambdas: [100, 1000, 3000, 10000]
    delta_moment: [second_moment]
    affine: true
    shrink_A: true
    shrink_B: false
    ridge: 1.0e-4
    svd_tol: 1.0e-7

cv:
  group_col: slide_id
  n_splits: 5
  seed: 0
  probe_type: sgd

runtime:
  apply_batch_size: 8192